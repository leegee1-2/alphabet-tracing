<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trace the Letters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF5EF;
    --paper: #FFFFFF;
    --ink: #2F4A3A;
    --soft: #6E8B78;
    --leaf: #A8D5B5;
    --trace: #3F7A57;
    --guide: #D3E5D8;
    --guide-edge: #9BBBA5;
    --good: #F7E3A1;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Fredoka", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  }
  .card {
    width: min(440px, 100%);
    background: var(--paper);
    border-radius: 28px;
    padding: 22px 20px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .title { display: flex; align-items: center; gap: 10px; }
  .animal { font-size: 44px; line-height: 1; transition: transform 0.4s ease; }
  .animal.bob { animation: bob 2.6s ease-in-out infinite; }
  .name { font-size: 18px; margin: 0; color: var(--soft); font-weight: 500; }
  .name b { color: var(--ink); font-weight: 600; }
  .segmented {
    display: inline-flex;
    background: var(--bg);
    border-radius: 999px;
    padding: 4px;
  }
  .segmented button {
    background: transparent;
    padding: 6px 14px;
    font-size: 15px;
  }
  .segmented button[aria-pressed="true"] { background: var(--paper); box-shadow: 0 1px 3px rgba(47,74,58,0.15); }

  .board {
    width: 100%;
    max-width: 340px;
    aspect-ratio: 1 / 1;
    position: relative;
    border-radius: 22px;
    background: var(--bg);
    overflow: hidden;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }
  .meter {
    width: 100%;
    max-width: 340px;
    height: 10px;
    background: var(--bg);
    border-radius: 999px;
    overflow: hidden;
  }
  .meter > div {
    height: 100%;
    width: 0%;
    background: var(--leaf);
    transition: width 0.5s ease, background 0.5s ease;
  }
  .message {
    min-height: 28px;
    font-size: 20px;
    font-weight: 500;
    margin: 0;
    text-align: center;
    transition: opacity 0.3s ease;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  button {
    font: inherit;
    color: var(--ink);
    background: var(--leaf);
    border: 0;
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  button.ghost { background: transparent; border: 2px solid var(--leaf); }
  .progress {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 5px;
    max-width: 380px;
  }
  .progress i {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--guide);
    display: block;
    transition: background 0.4s ease;
  }
  .progress i.done { background: var(--leaf); }
  .progress i.on { background: var(--ink); }
  .celebrate { animation: pop 0.7s ease; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  @keyframes pop {
    0% { transform: scale(0.8); }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .animal.bob, .celebrate { animation: none; }
    .meter > div, .progress i, .message { transition: none; }
  }
</style>
</head>
<body>
<main class="card">
  <header>
    <div class="title">
      <span class="animal bob" id="animal" aria-hidden="true">🐜</span>
      <p class="name" id="name"><b>A</b> is for ant</p>
    </div>
    <div class="segmented" role="group" aria-label="Letter case">
      <button id="caseUpper" aria-pressed="true">ABC</button>
      <button id="caseLower" aria-pressed="false">abc</button>
    </div>
  </header>

  <div class="board" id="board">
    <canvas id="canvas" aria-label="Tracing area. Trace the dotted letter with your finger or mouse."></canvas>
  </div>

  <div class="meter" aria-hidden="true"><div id="meterFill"></div></div>
  <p class="message" id="message" aria-live="polite">Trace the dotted letter.</p>

  <div class="controls">
    <button class="ghost" id="clear">Erase</button>
    <button class="ghost" id="show">Show me</button>
    <button class="ghost" id="prev">← Previous</button>
    <button id="next">Next letter →</button>
  </div>

  <div class="progress" id="progress" aria-hidden="true"></div>
</main>

<script>
  const LETTERS = [
    { l: "A", w: "ant",       s: "ah",   a: "🐜" },
    { l: "B", w: "bear",      s: "buh",  a: "🐻" },
    { l: "C", w: "cat",       s: "kuh",  a: "🐱" },
    { l: "D", w: "duck",      s: "duh",  a: "🦆" },
    { l: "E", w: "elephant",  s: "eh",   a: "🐘" },
    { l: "F", w: "fox",       s: "fff",  a: "🦊" },
    { l: "G", w: "goat",      s: "guh",  a: "🐐" },
    { l: "H", w: "horse",     s: "huh",  a: "🐴" },
    { l: "I", w: "iguana",    s: "ih",   a: "🦎" },
    { l: "J", w: "jellyfish", s: "juh",  a: "🪼" },
    { l: "K", w: "koala",     s: "kuh",  a: "🐨" },
    { l: "L", w: "lion",      s: "lll",  a: "🦁" },
    { l: "M", w: "monkey",    s: "mmm",  a: "🐒" },
    { l: "N", w: "newt",      s: "nnn",  a: "🦎" },
    { l: "O", w: "octopus",   s: "ah",   a: "🐙" },
    { l: "P", w: "penguin",   s: "puh",  a: "🐧" },
    { l: "Q", w: "quail",     s: "kwuh", a: "🐦" },
    { l: "R", w: "rabbit",    s: "rrr",  a: "🐰" },
    { l: "S", w: "snake",     s: "sss",  a: "🐍" },
    { l: "T", w: "turtle",    s: "tuh",  a: "🐢" },
    { l: "U", w: "unicorn",   s: "uh",   a: "🦄" },
    { l: "V", w: "vole",      s: "vvv",  a: "🐭" },
    { l: "W", w: "walrus",    s: "wuh",  a: "🦭" },
    { l: "X", w: "ox",        s: "ks",   a: "🐂" },
    { l: "Y", w: "yak",       s: "yuh",  a: "🐃" },
    { l: "Z", w: "zebra",     s: "zzz",  a: "🦓" }
  ];

  const S = 320;                 // logical size of the tracing area
  const PASS = 0.6;              // share of the dotted letter that must be covered
  const BRUSH = 26;
  const FONT = '600 230px Fredoka, "Nunito", system-ui, sans-serif';

  const $ = id => document.getElementById(id);
  const canvas = $("canvas"), ctx = canvas.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = S * dpr; canvas.height = S * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Offscreen canvas records where the child has painted, at logical scale.
  const userMask = document.createElement("canvas");
  userMask.width = S; userMask.height = S;
  const uctx = userMask.getContext("2d", { willReadFrequently: true });

  let index = 0, upper = true, guideCells = [], drawing = false, last = null, done = new Set(), inks = 0;
  let revealT = null;

  function currentChar() {
    return upper ? LETTERS[index].l : LETTERS[index].l.toLowerCase();
  }

  // Builds the list of pixel indices that make up the dotted guide letter.
  function buildGuideCells() {
    const g = document.createElement("canvas");
    g.width = S; g.height = S;
    const gc = g.getContext("2d", { willReadFrequently: true });
    gc.font = FONT;
    gc.textAlign = "center";
    gc.textBaseline = "middle";
    gc.fillStyle = "#000";
    gc.fillText(currentChar(), S / 2, S / 2 + 6);
    const data = gc.getImageData(0, 0, S, S).data;
    const cells = [];
    for (let i = 3; i < data.length; i += 4) if (data[i] > 128) cells.push((i - 3) / 4);
    guideCells = cells;
  }

  function drawBase(revealFraction = 1) {
    ctx.clearRect(0, 0, S, S);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, S, S);
    ctx.save();
    ctx.font = FONT;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const x = S / 2, y = S / 2 + 6;
    if (revealFraction < 1) {
      ctx.beginPath();
      ctx.rect(0, 0, S * revealFraction, S);
      ctx.clip();
    }
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--guide").trim();
    ctx.fillText(currentChar(), x, y);
    ctx.setLineDash([9, 9]);
    ctx.lineWidth = 3;
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--guide-edge").trim();
    ctx.strokeText(currentChar(), x, y);
    ctx.restore();
  }

  function redrawInk() {
    ctx.drawImage(userMask, 0, 0, S, S);
  }

  function render(revealFraction = 1) {
    drawBase(revealFraction);
    redrawInk();
  }

  // Share of the dotted letter the child has covered.
  function coverage() {
    if (!guideCells.length) return 0;
    const u = uctx.getImageData(0, 0, S, S).data;
    let hit = 0;
    for (const c of guideCells) if (u[c * 4 + 3] > 0) hit++;
    return hit / guideCells.length;
  }

  function updateMeter(share) {
    const pct = Math.round(Math.min(share / PASS, 1) * 100);
    $("meterFill").style.width = pct + "%";
    $("meterFill").style.background = share >= PASS ? "var(--good)" : "var(--leaf)";
  }

  function say(text) {
    if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
      setMessage("Sound isn't supported in this browser.");
      return;
    }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.8; u.pitch = 1.1;
      u.onerror = () => setMessage("Sound couldn't play. Check the volume and try again.");
      speechSynthesis.speak(u);
    } catch (e) {
      setMessage("Sound couldn't play on this device.");
    }
  }

  function setMessage(text) { $("message").textContent = text; }

  function setLetter(i) {
    index = (i + LETTERS.length) % LETTERS.length;
    const item = LETTERS[index];
    $("animal").textContent = item.a;
    $("animal").classList.remove("celebrate");
    $("name").innerHTML = `<b>${currentChar()}</b> is for ${item.w}`;
    uctx.clearRect(0, 0, S, S);
    inks = 0;
    buildGuideCells();
    updateMeter(0);
    setMessage("Trace the dotted letter.");
    render();
    renderProgress();
  }

  function renderProgress() {
    const wrap = $("progress");
    if (!wrap.children.length) {
      LETTERS.forEach(() => wrap.appendChild(document.createElement("i")));
    }
    [...wrap.children].forEach((el, k) => {
      el.classList.toggle("done", done.has(k));
      el.classList.toggle("on", k === index);
    });
  }

  function paintTo(x, y) {
    const pts = [last, { x, y }];
    for (const c of [ctx, uctx]) {
      c.lineCap = "round"; c.lineJoin = "round"; c.lineWidth = BRUSH;
      c.strokeStyle = c === ctx ? getComputedStyle(document.documentElement).getPropertyValue("--trace").trim() : "#000";
      c.beginPath(); c.moveTo(pts[0].x, pts[0].y); c.lineTo(pts[1].x, pts[1].y); c.stroke();
    }
    last = { x, y };
  }

  function pointerPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (S / r.width), y: (e.clientY - r.top) * (S / r.height) };
  }

  canvas.addEventListener("pointerdown", e => {
    if (revealT) return;
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    last = pointerPos(e);
    paintTo(last.x, last.y);
    inks++;
  });
  canvas.addEventListener("pointermove", e => {
    if (!drawing) return;
    const p = pointerPos(e);
    paintTo(p.x, p.y);
  });
  const endStroke = () => {
    if (!drawing) return;
    drawing = false;
    last = null;
    const share = coverage();
    updateMeter(share);
    if (share >= PASS && !done.has(index)) finishLetter();
    else if (inks > 0 && share < PASS) setMessage("Keep going, you're doing great!");
  };
  canvas.addEventListener("pointerup", endStroke);
  canvas.addEventListener("pointercancel", endStroke);

  function finishLetter() {
    done.add(index);
    renderProgress();
    const item = LETTERS[index];
    setMessage(["Wonderful!", "Great job!", "You did it!", "Super tracing!"][index % 4]);
    $("animal").classList.remove("celebrate");
    void $("animal").offsetWidth;
    $("animal").classList.add("celebrate");
    say(`${currentChar()}. ${item.w}. Well done.`);
  }

  $("clear").addEventListener("click", () => {
    uctx.clearRect(0, 0, S, S);
    inks = 0;
    updateMeter(0);
    setMessage("Let's try again.");
    render();
  });

  $("show").addEventListener("click", () => {
    if (revealT) return;
    uctx.clearRect(0, 0, S, S);
    inks = 0;
    updateMeter(0);
    const start = performance.now(), dur = 1400;
    const step = now => {
      const t = Math.min((now - start) / dur, 1);
      render(t);
      if (t < 1) revealT = requestAnimationFrame(step);
      else { revealT = null; render(1); }
    };
    setMessage("Watch the letter, then try it yourself.");
    say(`${currentChar()}. ${LETTERS[index].w}.`);
    revealT = requestAnimationFrame(step);
  });

  $("next").addEventListener("click", () => setLetter(index + 1));
  $("prev").addEventListener("click", () => setLetter(index - 1));

  $("caseUpper").addEventListener("click", () => setCase(true));
  $("caseLower").addEventListener("click", () => setCase(false));
  function setCase(isUpper) {
    upper = isUpper;
    $("caseUpper").setAttribute("aria-pressed", String(isUpper));
    $("caseLower").setAttribute("aria-pressed", String(!isUpper));
    setLetter(index);
  }

  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") setLetter(index + 1);
    if (e.key === "ArrowLeft") setLetter(index - 1);
  });

  // Wait for the rounded font so the dotted guide matches what kids see.
  const ready = document.fonts && document.fonts.load ? document.fonts.load(FONT, "A") : Promise.resolve();
  ready.catch(() => {}).finally(() => setLetter(0));
</script>
  <p>Music: "Morning Dew" by Migfus20 on freesound.org, CC BY 4.0</p>
</body>
</html>
