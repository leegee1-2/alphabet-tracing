<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trace the Letters</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#CFEAF2">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #CFEAF2;
    --cloud: #FFFFFF;
    --grass: #C9E29C;
    --grass-dark: #B5D984;
    --hill: #A8CF7E;
    --paper: rgba(255, 255, 255, 0.94);
    --ink: #3E5A46;
    --soft: #6E8B78;
    --leaf: #B6DDA6;
    --leaf-dark: #8FC782;
    --peach: #F7B48A;
    --trace: #8A5F45;
    --guide: #FFD27D;
    --guide-edge: #E0A24E;
    --good: #FFD27D;
    --dot: #E6EDD4;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Fredoka", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px calc(env(safe-area-inset-bottom, 0px) + 8px);
    background:
      radial-gradient(ellipse 45% 22% at 8% 100%, var(--hill) 0 70%, transparent 72%),
      radial-gradient(ellipse 60% 28% at 100% 92%, var(--hill) 0 70%, transparent 72%),
      radial-gradient(ellipse 40% 12% at 30% 18%, var(--cloud) 0 60%, transparent 62%),
      radial-gradient(ellipse 30% 10% at 80% 10%, var(--cloud) 0 60%, transparent 62%),
      linear-gradient(180deg, var(--sky) 0%, #E6F4EE 58%, var(--grass) 58%, var(--grass-dark) 100%);
    background-attachment: fixed;
  }
  .card {
    width: min(440px, 100%);
    background: var(--paper);
    border-radius: 30px;
    padding: 14px 20px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 0 rgba(120, 160, 120, 0.25), 0 14px 30px rgba(60, 100, 80, 0.15);
  }
  header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .title { display: flex; align-items: center; gap: 10px; }
  .animal {
    font-size: 40px; line-height: 1;
    background: #FFF4D6;
    border-radius: 50%;
    width: 58px; height: 58px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.4s ease;
  }
  .animal.bob { animation: bob 2.6s ease-in-out infinite; }
  .name { font-size: 18px; margin: 0; color: var(--soft); font-weight: 500; }
  .name b { color: var(--ink); font-weight: 600; font-size: 22px; }
  .segmented {
    display: inline-flex;
    background: #EEF6EC;
    border-radius: 999px;
    padding: 4px;
  }
  .segmented button {
    background: transparent;
    color: var(--ink);
    padding: 6px 14px;
    font-size: 15px;
  }
  .segmented button[aria-pressed="true"] {
    background: var(--paper);
    box-shadow: 0 1px 4px rgba(47, 74, 58, 0.18);
  }

  .board {
    width: min(300px, 100%, 44vh);
    aspect-ratio: 1 / 1;
    position: relative;
    border-radius: 24px;
    background: #FFFDF6;
    border: 4px solid #F3EBD3;
    overflow: hidden;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }
  .meter {
    width: min(300px, 100%);
    height: 12px;
    background: #F1E6CF;
    border-radius: 999px;
    overflow: hidden;
  }
  .meter > div {
    height: 100%;
    width: 0%;
    background: var(--leaf);
    transition: width 0.5s ease, background 0.5s ease;
  }
  .message {
    min-height: 28px;
    font-size: 20px;
    font-weight: 500;
    margin: 0;
    text-align: center;
    color: var(--ink);
    transition: opacity 0.3s ease;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  button {
    font: inherit;
    color: var(--ink);
    background: var(--leaf);
    border: 0;
    border-radius: 999px;
    padding: 9px 16px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--leaf-dark);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--leaf-dark); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  button.ghost {
    background: #FFFFFF;
    border: 2px solid var(--leaf);
    box-shadow: none;
  }
  button.ghost:active { transform: translateY(1px); }
  #next { background: var(--peach); box-shadow: 0 3px 0 #E3956A; }
  #next:active { box-shadow: 0 1px 0 #E3956A; }
  .progress {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    max-width: 380px;
  }
  .progress i {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--dot);
    display: block;
    transition: background 0.4s ease, transform 0.3s ease;
  }
  .progress i.done { background: var(--guide); }
  .progress i.on { background: var(--peach); transform: scale(1.3); }
  .celebrate { animation: pop 0.7s ease; }
  .credit {
    font-size: 0.6rem;
    color: #6E8B78;
    text-align: center;
    margin: 4px 0 0;
    line-height: 1.3;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  @keyframes pop {
    0% { transform: scale(0.8); }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .animal.bob, .celebrate { animation: none; }
    .meter > div, .progress i, .message { transition: none; }
  }

  /* Tap to start screen */
  #startScreen {
    position: fixed; inset: 0; z-index: 999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px;
    background:
      radial-gradient(ellipse 45% 22% at 8% 100%, var(--hill) 0 70%, transparent 72%),
      radial-gradient(ellipse 60% 28% at 100% 92%, var(--hill) 0 70%, transparent 72%),
      linear-gradient(180deg, var(--sky) 0%, #E6F4EE 58%, var(--grass) 58%, var(--grass-dark) 100%);
    cursor: pointer;
  }
  #startScreen .big {
    font-size: 2.4rem;
    color: var(--ink);
    background: #FFFFFF;
    padding: 18px 40px;
    border-radius: 999px;
    box-shadow: 0 6px 0 var(--leaf-dark);
  }
  #startScreen .small { color: var(--ink); font-size: 1rem; opacity: 0.8; }

  /* Portrait message: shown only when the iPad is held upright */
  #rotate { display: none; }
  @media (orientation: portrait) {
    #rotate {
      display: flex; position: fixed; inset: 0; z-index: 1000;
      flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(180deg, var(--sky) 0%, #E6F4EE 58%, var(--grass) 58%, var(--grass-dark) 100%);
      font-size: 2rem; text-align: center; padding: 2rem; color: var(--ink);
    }
    #rotate::before { content: "🐻"; font-size: 4rem; margin-bottom: 12px; }
  }
</style>
</head>
<body>
<div id="rotate">Please turn your iPad sideways</div>
<div id="startScreen">
  <span class="big">🐻 Tap to start</span>
  <span class="small">Let's trace some letters!</span>
</div>

<main class="card">
  <header>
    <div class="title">
      <span class="animal bob" id="animal" aria-hidden="true">🐜</span>
      <p class="name" id="name"><b>A</b> is for ant</p>
    </div>
    <div class="segmented" role="group" aria-label="Letter case">
      <button id="caseUpper" aria-pressed="true">ABC</button>
      <button id="caseLower" aria-pressed="false">abc</button>
    </div>
  </header>

  <div class="board" id="board">
    <canvas id="canvas" aria-label="Tracing area. Trace the dotted letter with your finger or mouse."></canvas>
  </div>

  <div class="meter" aria-hidden="true"><div id="meterFill"></div></div>
  <p class="message" id="message" aria-live="polite">Trace the dotted letter.</p>

  <div class="controls">
    <button class="ghost" id="clear">Erase</button>
    <button class="ghost" id="prev">← Previous</button>
    <button id="next">Next letter →</button>
  </div>

  <div class="progress" id="progress" aria-hidden="true"></div>

  <p class="credit">Music: "Morning Dew" by Migfus20 on freesound.org, CC BY 4.0</p>
</main>

<script>
  const LETTERS = [
    { l: "A", w: "ant",       a: "🐜" },
    { l: "B", w: "bear",      a: "🐻" },
    { l: "C", w: "cat",       a: "🐱" },
    { l: "D", w: "duck",      a: "🦆" },
    { l: "E", w: "elephant",  a: "🐘" },
    { l: "F", w: "fox",       a: "🦊" },
    { l: "G", w: "goat",      a: "🐐" },
    { l: "H", w: "horse",     a: "🐴" },
    { l: "I", w: "iguana",    a: "🦎" },
    { l: "J", w: "jellyfish", a: "🪼" },
    { l: "K", w: "koala",     a: "🐨" },
    { l: "L", w: "lion",      a: "🦁" },
    { l: "M", w: "monkey",    a: "🐒" },
    { l: "N", w: "newt",      a: "🦎" },
    { l: "O", w: "octopus",   a: "🐙" },
    { l: "P", w: "penguin",   a: "🐧" },
    { l: "Q", w: "quail",     a: "🐦" },
    { l: "R", w: "rabbit",    a: "🐰" },
    { l: "S", w: "snake",     a: "🐍" },
    { l: "T", w: "turtle",    a: "🐢" },
    { l: "U", w: "unicorn",   a: "🦄" },
    { l: "V", w: "vole",      a: "🐭" },
    { l: "W", w: "walrus",    a: "🦭" },
    { l: "X", w: "ox",        a: "🐂" },
    { l: "Y", w: "yak",       a: "🐃" },
    { l: "Z", w: "zebra",     a: "🦓" }
  ];

  const S = 320;
  const PASS = 0.6;
  const BRUSH = 26;
  const FONT = '600 230px Fredoka, "Nunito", system-ui, sans-serif';

  const $ = id => document.getElementById(id);
  const canvas = $("canvas"), ctx = canvas.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = S * dpr; canvas.height = S * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const userMask = document.createElement("canvas");
  userMask.width = S; userMask.height = S;
  const uctx = userMask.getContext("2d", { willReadFrequently: true });

  // Background music: starts when the child taps "Tap to start", then loops quietly
  const music = new Audio("ding.mp3");
  music.loop = true;
  music.volume = 0.3;
  music.preload = "auto";
  music.addEventListener("error", () => setMessage("Sound file missing. Check that ding.mp3 is an MP3."));

  // Completion sound: its own player, so it doesn't interrupt the music
  const chime = new Audio("ding.mp3");
  chime.preload = "auto";
  chime.volume = 1;
  function playChime() {
    chime.currentTime = 0;
    chime.play().catch(() => {});
  }

  let index = 0, upper = true, guideCells = [], drawing = false, last = null, done = new Set(), inks = 0;

  function currentChar() {
    return upper ? LETTERS[index].l : LETTERS[index].l.toLowerCase();
  }

  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function buildGuideCells() {
    const g = document.createElement("canvas");
    g.width = S; g.height = S;
    const gc = g.getContext("2d", { willReadFrequently: true });
    gc.font = FONT;
    gc.textAlign = "center";
    gc.textBaseline = "middle";
    gc.fillStyle = "#000";
    gc.fillText(currentChar(), S / 2, S / 2 + 6);
    const data = gc.getImageData(0, 0, S, S).data;
    const cells = [];
    for (let i = 3; i < data.length; i += 4) if (data[i] > 128) cells.push((i - 3) / 4);
    guideCells = cells;
  }

  function drawBase() {
    ctx.clearRect(0, 0, S, S);
    ctx.fillStyle = "#FFFDF6";
    ctx.fillRect(0, 0, S, S);
    ctx.save();
    ctx.font = FONT;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const x = S / 2, y = S / 2 + 6;
    ctx.fillStyle = cssVar("--guide");
    ctx.fillText(currentChar(), x, y);
    ctx.setLineDash([9, 9]);
    ctx.lineWidth = 3;
    ctx.strokeStyle = cssVar("--guide-edge");
    ctx.strokeText(currentChar(), x, y);
    ctx.restore();
  }

  function render() {
    drawBase();
    ctx.drawImage(userMask, 0, 0, S, S);
  }

  function coverage() {
    if (!guideCells.length) return 0;
    const u = uctx.getImageData(0, 0, S, S).data;
    let hit = 0;
    for (const c of guideCells) if (u[c * 4 + 3] > 0) hit++;
    return hit / guideCells.length;
  }

  function updateMeter(share) {
    const pct = Math.round(Math.min(share / PASS, 1) * 100);
    $("meterFill").style.width = pct + "%";
    $("meterFill").style.background = share >= PASS ? "var(--good)" : "var(--leaf)";
  }

  function setMessage(text) { $("message").textContent = text; }

  function setLetter(i) {
    index = (i + LETTERS.length) % LETTERS.length;
    const item = LETTERS[index];
    $("animal").textContent = item.a;
    $("animal").classList.remove("celebrate");
    $("name").innerHTML = `<b>${currentChar()}</b> is for ${item.w}`;
    uctx.clearRect(0, 0, S, S);
    inks = 0;
    buildGuideCells();
    updateMeter(0);
    setMessage("Trace the dotted letter.");
    render();
    renderProgress();
  }

  function renderProgress() {
    const wrap = $("progress");
    if (!wrap.children.length) {
      LETTERS.forEach(() => wrap.appendChild(document.createElement("i")));
    }
    [...wrap.children].forEach((el, k) => {
      el.classList.toggle("done", done.has(k));
      el.classList.toggle("on", k === index);
    });
  }

  function paintTo(x, y) {
    const pts = [last, { x, y }];
    for (const c of [ctx, uctx]) {
      c.lineCap = "round"; c.lineJoin = "round"; c.lineWidth = BRUSH;
      c.strokeStyle = c === ctx ? cssVar("--trace") : "#000";
      c.beginPath(); c.moveTo(pts[0].x, pts[0].y); c.lineTo(pts[1].x, pts[1].y); c.stroke();
    }
    last = { x, y };
  }

  function pointerPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (S / r.width), y: (e.clientY - r.top) * (S / r.height) };
  }

  canvas.addEventListener("pointerdown", e => {
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    last = pointerPos(e);
    paintTo(last.x, last.y);
    inks++;
  });
  canvas.addEventListener("pointermove", e => {
    if (!drawing) return;
    const p = pointerPos(e);
    paintTo(p.x, p.y);
  });
  const endStroke = () => {
    if (!drawing) return;
    drawing = false;
    last = null;
    const share = coverage();
    updateMeter(share);
    if (share >= PASS && !done.has(index)) finishLetter();
    else if (inks > 0 && share < PASS) setMessage("Keep going, you're doing great!");
  };
  canvas.addEventListener("pointerup", endStroke);
  canvas.addEventListener("pointercancel", endStroke);

  function finishLetter() {
    done.add(index);
    renderProgress();
    setMessage(["Wonderful!", "Great job!", "You did it!", "Super tracing!"][index % 4]);
    $("animal").classList.remove("celebrate");
    void $("animal").offsetWidth;
    $("animal").classList.add("celebrate");
    playChime();
  }

  $("clear").addEventListener("click", () => {
    uctx.clearRect(0, 0, S, S);
    inks = 0;
    updateMeter(0);
    setMessage("Let's try again.");
    render();
  });

  $("next").addEventListener("click", () => setLetter(index + 1));
  $("prev").addEventListener("click", () => setLetter(index - 1));

  $("caseUpper").addEventListener("click", () => setCase(true));
  $("caseLower").addEventListener("click", () => setCase(false));
  function setCase(isUpper) {
    upper = isUpper;
    $("caseUpper").setAttribute("aria-pressed", String(isUpper));
    $("caseLower").setAttribute("aria-pressed", String(!isUpper));
    setLetter(index);
  }

  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") setLetter(index + 1);
    if (e.key === "ArrowLeft") setLetter(index - 1);
  });

  // Tap to start: this tap unlocks audio on iPad, and the music starts right away
  const startScreen = $("startScreen");
  startScreen.addEventListener("click", () => {
    music.play().catch(() => {});
    chime.load();
    startScreen.remove();
  }, { once: true });

  const ready = document.fonts && document.fonts.load ? document.fonts.load(FONT, "A") : Promise.resolve();
  ready.catch(() => {}).finally(() => setLetter(0));
</script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>
